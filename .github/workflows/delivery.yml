name: Validate and deliver
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/delivery.yml .github/workflows/rollback.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Audit application dependencies
        run: python -m pip_audit -r app/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Validate Terraform and policy tests without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          for stack in state platform application; do
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
            terraform -chdir=infra/$stack test
          done
      - name: Build and start the exact commit
        env:
          APP_REVISION: ${{ github.sha }}
        run: docker compose up --build -d --wait
      - name: Check health and baked-in revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python scripts/smoke.py --revision "$EXPECTED_REVISION"
      - if: always()
        run: docker compose logs && docker compose down
  release:
    name: Publish and deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: delivery-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      STATE_PREFIX: ${{ vars.STATE_PREFIX }}
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - name: Check deployment settings
        run: |
          test -n "$AWS_REGION"
          test -n "$STATE_BUCKET"
          test -n "$STATE_PREFIX"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: delivery-${{ github.run_id }}
      - name: Read provisioned platform configuration
        run: |
          aws s3 cp "s3://$STATE_BUCKET/$STATE_PREFIX/deployment.json" platform.json
          python -c 'import json,os; c=json.load(open("platform.json")); assert c["region"]==os.environ["AWS_REGION"]; print("REPOSITORY_URL="+c["repository_url"])' >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish immutable release image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPOSITORY_URL }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: APP_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Apply release and verify ECS revision
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python scripts/deploy.py --digest "$IMAGE_DIGEST" --revision "$EXPECTED_REVISION" --state-bucket "$STATE_BUCKET" --state-prefix "$STATE_PREFIX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish release summary
        run: |
          {
            echo '### Verified release'
            echo '```json'
            cat artifacts/release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
