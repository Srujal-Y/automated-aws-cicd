name: Redeploy a verified release
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Previously verified sha256 image digest (including sha256:)'
        required: true
        type: string
      revision:
        description: 'Full Git commit SHA baked into that image'
        required: true
        type: string
permissions:
  contents: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: delivery-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      STATE_PREFIX: ${{ vars.STATE_PREFIX }}
      IMAGE_DIGEST: ${{ inputs.digest }}
      EXPECTED_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 cp "s3://$STATE_BUCKET/$STATE_PREFIX/deployment.json" platform.json
      - name: Redeploy through Terraform and verify
        run: python scripts/deploy.py --digest "$IMAGE_DIGEST" --revision "$EXPECTED_REVISION" --state-bucket "$STATE_BUCKET" --state-prefix "$STATE_PREFIX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-${{ github.run_id }}
          path: artifacts/release.json
          if-no-files-found: error
